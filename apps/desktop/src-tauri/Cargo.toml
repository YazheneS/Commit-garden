[package]
name = "github-garden"
version = "0.1.0"
description = "A quiet desktop companion for your GitHub garden"
authors = ["GitHub Garden"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
